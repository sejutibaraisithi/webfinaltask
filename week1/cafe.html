<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Café Food Ordering System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Campus Café Food Ordering System</h1>

    <form id="orderForm">

        <!-- Customer Information -->
        <h2>Customer Information</h2>

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name">
        <small class="error" id="nameError"></small>

        <label for="email">Email</label>
        <input type="email" id="email" name="email">
        <small class="error" id="emailError"></small>

        <label for="phone">Phone Number</label>
        <input type="text" id="phone" name="phone">
        <small class="error" id="phoneError"></small>

        <label for="studentId">Student ID</label>
        <input type="text" id="studentId" name="studentId">
        <small class="error" id="studentIdError"></small>

        <label>Gender</label>
        <div>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
        </div>
        <small class="error" id="genderError"></small>

        <label for="department">Department</label>
        <select id="department" name="department">
            <option value="">-- Select Department --</option>
            <option value="CSE">CSE</option>
            <option value="EEE">EEE</option>
            <option value="BBA">BBA</option>
            <option value="English">English</option>
            <option value="Other">Other</option>
        </select>
        <small class="error" id="departmentError"></small>

        <!-- Food Selection -->
        <h2>Food Selection</h2>

        <div class="food-items">

            <input type="checkbox" id="burger" name="food" value="Burger" data-price="5">
            <label for="burger">Burger ($5)</label><br>

            <input type="checkbox" id="pizza" name="food" value="Pizza" data-price="8">
            <label for="pizza">Pizza ($8)</label><br>

            <input type="checkbox" id="sandwich" name="food" value="Sandwich" data-price="4">
            <label for="sandwich">Sandwich ($4)</label><br>

            <input type="checkbox" id="fries" name="food" value="French Fries" data-price="3">
            <label for="fries">French Fries ($3)</label><br>

            <input type="checkbox" id="coffee" name="food" value="Coffee" data-price="2">
            <label for="coffee">Coffee ($2)</label><br>

            <input type="checkbox" id="drink" name="food" value="Cold Drink" data-price="2">
            <label for="drink">Cold Drink ($2)</label>

        </div>

        <small class="error" id="foodError"></small>

        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" min="1">
        <small class="error" id="quantityError"></small>

        <label for="instructions">Special Instructions</label>
        <textarea id="instructions" name="instructions" rows="4"></textarea>

        <br><br>

        <button type="submit">Place Order</button>

    </form>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
